{{ $have := hugo.Data.profile.skills.primary }}
{{ $lead := slice "Kubernetes" "Azure" "Terraform" "Ansible" "GitHub Actions" "Azure DevOps" "Docker" "Linux" }}
<section class="section" id="skills">
  <div class="section-head">
    <h2>Skills</h2>
  </div>
  <ul class="skill-pills">
    {{ range $lead }}
      {{ if in $have . }}<li>{{ . }}</li>{{ end }}
    {{ end }}
  </ul>
</section>
