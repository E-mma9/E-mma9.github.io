<section class="section" id="skills">
  <div class="section-head">
    <h2>Skills</h2>
  </div>
  <div class="skills">
    {{ range hugo.Data.profile.skills }}
    <div class="skill-group">
      <h3>{{ .group }}</h3>
      <ul class="chips">
        {{ range .items }}<li class="chip">{{ .name }}{{ with .note }}<span class="chip-note">{{ . }}</span>{{ end }}</li>
        {{ end }}
      </ul>
    </div>
    {{ end }}
  </div>
</section>
