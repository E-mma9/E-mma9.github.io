{{ $posts := where site.RegularPages "Section" "posts" }}
{{ if $posts }}
<section class="section" id="writing">
  <div class="section-head">
    <h2>Writing</h2>
    <a class="section-link" href="{{ "/posts/" | relURL }}">All posts →</a>
  </div>
  <div class="lined">
    {{ range first 3 $posts.ByDate.Reverse }}
    <a class="line-item" href="{{ .RelPermalink }}">
      <span class="line-title">{{ .Title }}</span>
      <span class="line-meta">{{ .Date.Format "02 Jan 2006" }} <span class="arrow" aria-hidden="true">→</span></span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
