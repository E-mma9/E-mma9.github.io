{{ $have := hugo.Data.profile.skills.primary }}
{{ $lead := slice "Kubernetes" "Azure" "Terraform" "Ansible" "GitHub Actions" }}
<section class="section" id="skills">
  <h2>Skills</h2>
  <ul class="skill-pills">
    {{ range $lead }}
      {{ if in $have . }}<li>{{ . }}</li>{{ end }}
    {{ end }}
  </ul>
</section>
