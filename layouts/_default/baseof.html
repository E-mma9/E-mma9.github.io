<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="page">
    <header class="site-header">
      <div class="wrap-wide">
        {{- partial "nav.html" . -}}
      </div>
    </header>
    <main id="content" class="wrap{{ if .IsHome }} wrap-wide{{ end }}">
      {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer.html" . -}}
  </div>
</body>
</html>
