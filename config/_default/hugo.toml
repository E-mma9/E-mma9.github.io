baseURL = "https://emmanueltekle.nl/"
defaultContentLanguage = "en"
title = "Emmanuel Tekle"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
summaryLength = 30
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 20

[languages.en]
  locale = "en"
  label = "English"

[params]
  description = "DevOps & Platform Engineer in the making. Azure-certified (AZ-104) Cloud & Cybersecurity student in Enschede, available Feb – Jul 2027."
  author = "Emmanuel Tekle"
  email = "emmanueltekle@gmail.com"
  github = "https://github.com/E-mma9"
  linkedin = "https://linkedin.com/in/emmanuel-tekle-3485b334a"
  cv = "/Emmanuel_Tekle_CV.pdf"
  location = "Enschede, NL"
  goatcounter = "emmanueltekle"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[permalinks]
  posts = "/posts/:slug/"
  projects = "/projects/:slug/"
