  <div>© {{ now.Year }} — {{ site.Params.location }} <span class="cursor">█</span></div>
  <div class="foot-links">
    <a href="mailto:{{ site.Params.email }}">email</a>
    <a href="{{ site.Params.github }}">github</a>

  </div>
</footer>
