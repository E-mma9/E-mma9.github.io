{{ $p := hugo.Data.profile }}
<section class="hero">
  <h1>{{ $p.name }}</h1>
  <p class="hero-role">{{ $p.headline }} <span class="hero-dot" aria-hidden="true">·</span> {{ $p.positioning }}</p>
  <div class="hero-actions">
    <a class="btn btn-primary" href="{{ site.Params.cv | relURL }}" target="_blank" rel="noopener noreferrer">Download CV</a>
    <a class="btn btn-secondary" href="#contact">Get in touch</a>
  </div>
</section>
