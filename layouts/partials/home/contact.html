<section class="section" id="contact">
  <div class="section-head">
    <h2>Contact</h2>
    <span class="section-meta">replies within 24h</span>
  </div>
  <div class="contact-links">
    <a href="mailto:{{ site.Params.email }}">
      <span class="contact-k">Email</span>
      <span>{{ site.Params.email }}</span>
    </a>
    <a href="{{ site.Params.github }}" target="_blank" rel="noopener noreferrer">
      <span class="contact-k">GitHub</span>
      <span>E-mma9</span>
    </a>
    <a href="{{ site.Params.linkedin }}" target="_blank" rel="noopener noreferrer">
      <span class="contact-k">LinkedIn</span>
      <span>Emmanuel Tekle</span>
    </a>
    <a href="{{ site.Params.cv | relURL }}" target="_blank" rel="noopener noreferrer">
      <span class="contact-k">CV</span>
      <span>Download PDF</span>
    </a>
  </div>
  <form class="contact-form" action="https://formspree.io/f/xaqlbeoa" method="POST">
    <div class="field-row">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
      </div>
    </div>
    <div class="field">
      <label for="subject">Subject</label>
      <input id="subject" name="subject" type="text" placeholder="Internship, role, or question">
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required placeholder="Tell me more"></textarea>
    </div>
    <input type="hidden" name="_subject" value="New message from emmanueltekle.nl">
    <button type="submit" class="btn btn-primary submit">Send message</button>
  </form>
</section>
