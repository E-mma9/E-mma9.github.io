{{ $posts := where site.RegularPages "Section" "posts" }}
{{ if $posts }}
<section class="section" id="writing">
  <div class="section-head">
    <h2>Latest writing</h2>
    <a class="section-link" href="{{ "/posts/" | relURL }}">All posts</a>
  </div>
  <div class="write-grid">
    {{ range first 5 $posts.ByDate.Reverse }}
    <a class="write-card" href="{{ .RelPermalink }}">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
      <span class="write-title">{{ .Title }}</span>
      {{ with .Params.summary }}<span class="write-summary">{{ . }}</span>{{ end }}
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
