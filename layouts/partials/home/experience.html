<section class="section" id="work">
  <div class="section-head">
    <h2>Experience</h2>
  </div>
  <div class="timeline">
    {{ range hugo.Data.profile.experience }}
    <article class="job">
      <div class="job-head">
        <div>
          <span class="job-role">{{ .role }}</span>
          <span class="job-org"> · {{ .company }}{{ with .note }} ({{ . }}){{ end }}</span>
        </div>
        <span class="job-meta">{{ .location }} · {{ .period }}</span>
      </div>
      <p class="job-line">{{ .line }}</p>
      {{ with .href }}<a class="text-link" href="{{ . | relURL }}">View project</a>{{ end }}
    </article>
    {{ end }}
  </div>
</section>
