{{ define "main" }}
<h1 class="article-title">{{ .Title }}</h1>

{{ if eq .Section "projects" }}
<div class="cards page-list">
  {{ range .Pages.ByWeight }}
  {{ partial "project-card.html" . }}
  {{ end }}
</div>
{{ else }}
<div class="lined page-list">
  {{ range .Pages.ByDate.Reverse }}
  <a class="line-item" href="{{ .RelPermalink }}">
    <span class="line-title">{{ .Title }}</span>
    <span class="line-meta">{{ .Date.Format "02 Jan 2006" }} <span class="arrow" aria-hidden="true">→</span></span>
  </a>
  {{ end }}
</div>
{{ end }}
{{ end }}
