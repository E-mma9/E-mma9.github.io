<section class="section" id="certifications">
  <h2>Certifications</h2>
  <div class="cert-minis">
    {{ range hugo.Data.profile.certifications }}
    {{ if eq .status "earned" }}
    {{ $c := . }}
    <article class="cert-mini">
      {{ with .image }}
      <img src="{{ . | relURL }}" alt="{{ $c.name }} certificate" width="{{ $c.image_width }}" height="{{ $c.image_height }}" loading="lazy">
      {{ end }}
      <div class="cert-mini-body">
        <h3>{{ .name }}</h3>
        {{ with .verify_url }}<a href="{{ . }}" target="_blank" rel="noopener noreferrer">Verify</a>{{ end }}
      </div>
    </article>
    {{ end }}
    {{ end }}
  </div>
</section>
