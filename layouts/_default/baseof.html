<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body{{ if .IsHome }} class="home"{{ end }}>
  {{- partial "nav.html" . -}}
  <main class="{{ if .IsHome }}wrap-wide{{ else }}wrap{{ end }}">
    {{- block "main" . }}{{- end }}
  </main>
  {{- partial "footer.html" . -}}
</body>
</html>
