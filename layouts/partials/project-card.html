<a class="card" href="{{ .RelPermalink }}">
  <div class="card-top">
    {{ with .Params.status }}{{ partial "status.html" . }}{{ else }}<span></span>{{ end }}
    <span class="arrow" aria-hidden="true">↗</span>
  </div>
  <h3 class="card-title">{{ .Title }}</h3>
  {{ with (.Params.tagline | default .Params.summary) }}<p class="card-tagline">{{ . }}</p>{{ end }}
  {{ with .Params.tech }}<p class="card-tech">{{ delimit (first 4 .) " · " }}</p>{{ end }}
</a>
