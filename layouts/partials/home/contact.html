<section class="section" id="contact">
  <div class="section-head">
    <h2>Get in touch</h2>
    <span class="section-meta">replies within 24h</span>
  </div>
  <form class="contact-form" action="https://formspree.io/f/xaqlbeoa" method="POST">
    <div class="field-row">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com">
      </div>
    </div>
    <div class="field">
      <label for="subject">Subject</label>
      <input id="subject" name="subject" type="text" placeholder="Internship · role · question">
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required placeholder="Tell me more"></textarea>
    </div>
    <input type="hidden" name="_subject" value="New message from emmanueltekle.nl">
    <button type="submit" class="btn btn-primary submit">Send message</button>
  </form>
  <p class="contact-alt">or email <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></p>
</section>
